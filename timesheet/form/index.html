<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>JIA AN 填工时 · Timesheet</title>
<style>
  :root{--bg:#EEF0EC;--card:#fff;--ink:#1B2220;--ink2:#4A5450;--jib:#E3A600;--steel:#2C5A78}
  @media (prefers-color-scheme:dark){:root{--bg:#121614;--card:#1A201D;--ink:#E4E8E3;--ink2:#AEB7B2;--steel:#6FA3C8}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
       font:16px/1.5 -apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;padding:16px;box-sizing:border-box}
  main{background:var(--card);border-radius:14px;padding:28px 24px;max-width:420px;width:100%;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.08)}
  h1{margin:0 0 6px;font-size:24px}
  h1 b{background:var(--jib);color:#1B1600;padding:0 6px;margin-right:6px}
  p{color:var(--ink2);margin:6px 0}
  a.go{display:block;margin-top:20px;background:var(--steel);color:#fff;text-decoration:none;font-size:19px;font-weight:600;padding:16px;border-radius:10px}
</style>
</head>
<body>
<main>
  <h1><b>JIA AN</b>填工时</h1>
  <p id="msg">正在打开表单… Opening the timesheet form…</p>
  <a class="go" id="go" href="#" hidden>点这里填工时 · Tap to fill in</a>
</main>
<script src="../config.js"></script>
<script>
(function(){
  var f=(window.JIAAN_TS_CONFIG||{}).workerForm||"";
  var msg=document.getElementById("msg"), go=document.getElementById("go");
  if(!/^https:\/\/airtable\.com\//.test(f)){
    msg.textContent="表单还没设置好，请联系办公室。Form not ready yet — please contact the office.";
    return;
  }
  var url=f.split("?")[0]+"?prefill_Source=Worker+Form&hide_Source=true";
  go.href=url; go.hidden=false;
  location.replace(url);
})();
</script>
</body>
</html>
